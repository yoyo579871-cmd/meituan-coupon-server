name: 美团 WorkBuddy 专属券 - 每日自动领券

on:
  schedule:
    # UTC 18:00 = 北京凌晨02:00，对冲 GitHub 7-8 小时延迟后实际在北京 09:00-10:00 触发
    - cron: "0 18 * * *"
  # 允许手动触发
  workflow_dispatch:

jobs:
  claim:
    runs-on: ubuntu-latest
    timeout-minutes: 3

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Claim WorkBuddy Coupon
        env:
          MEITUAN_PT_TOKEN: ${{ secrets.MEITUAN_PT_TOKEN }}
          MEITUAN_AI_SCENE: a0d4da77f918ab204d86c911fcdd0ce1
        run: python claim_workbuddy.py
