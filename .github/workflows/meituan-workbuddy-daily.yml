name: 美团 WorkBuddy 专属券 - 每日自动领券

on:
  schedule:
    # UTC 19:17 = 北京时间/新加坡时间 03:17。
    # 放在午夜之后并避开整点；按已观察到的排队延迟，通常会落在 05:47-07:17。
    # 这只是执行时段，不宣称它是活动开放时间。
    - cron: "17 18 * * *"
  workflow_dispatch:
    inputs:
      check_only:
        description: "只检查凭据指纹，不发起领取；首次核对请保持勾选"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: meituan-workbuddy-claim
  cancel-in-progress: false

jobs:
  claim:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Check configuration or claim coupons
        env:
          MEITUAN_PT_TOKEN: ${{ secrets.MEITUAN_PT_TOKEN }}
          MEITUAN_AI_SCENE: a0d4da77f918ab204d86c911fcdd0ce1
          CHECK_ONLY: ${{ github.event_name == 'workflow_dispatch' && inputs.check_only }}
        run: |
          if [ "$CHECK_ONLY" = "true" ]; then
            python claim_workbuddy.py --check-config
          else
            python claim_workbuddy.py
          fi
