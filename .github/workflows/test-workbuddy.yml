name: WorkBuddy offline tests
on:
  pull_request:
    paths:
      - claim_workbuddy.py
      - test_claim_workbuddy.py
      - .github/workflows/test-workbuddy.yml
      - .github/workflows/meituan-workbuddy-daily.yml
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m unittest -v
